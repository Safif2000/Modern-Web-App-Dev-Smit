<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  
  <!-- Montserrat Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Reusing Sign Up CSS -->
  <link rel="stylesheet" href="../styles/signup.css" />
</head>
<body>

  <div class="signup-container">
    <form id="login-form-submit" class="card p-4 shadow-lg" style="width: 22rem;">
      <h2 class="text-center mb-4 fw-bold">Login Now</h2>

      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" placeholder="Enter email">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter password">
      </div>
    <a href="../index.html" class="btn btn-primary w-100 mt-2 text-decoration-none">Login</a>
      <div class="mt-3 text-center">
        <span>Don't have an account? </span>
        <a href="./signup.html" class="text-decoration-none">Sign Up</a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
