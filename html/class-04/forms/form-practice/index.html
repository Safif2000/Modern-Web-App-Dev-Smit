<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<br>
    
    <form style="width: fit-content;" >
        <fieldset>
            <legend > <h3>Contact details</h3></legend>
            <label>Email:</label>
        </br>
            <input type="email" name="email" size="30" >
          </br>  
        </br>
          <label>Mobile:</label>
          </br>
           
          <input type="tel" name="mobile" size="30" >
          </br>
           </br>
          <label>Telephone:</label>
          </br>
           
          <input type="tel" name="telephone" size="30">

           

        </fieldset>
    </form>

</br>
</br>


<form action="" method="">
<fieldset>
  <legend><h3>Your Details</h3></legend>
  <label>Name:</label>
  <input type="text" name="name" size="30" required >
    </br>
    </br>
  <label>Email:</label>
  <input type="email" name="email" size="30" required>

</fieldset>

</br>
<fieldset>
    <legend><h3>Your Review</h3></legend>
    <label>How did you hear about us?</label>
    <select>
  <option value="google">Google</option>
    <option value="fb">Facebook</option>  
</select>
</br>
</br>
<label>Would you visit again?</label>
<input type="radio" name="visitagain" value="yes">Yes
<input type="radio" name="visitagain" value="no">No
<input type="radio" name="visitagain" value="maybe">Maybe
</br>
</br>
<label>Comments:</label>
</br>
</br>
<textarea name="comments" rows="4" cols="50"></textarea>
</br>
</br>
<input type="checkbox" name="subscribe" value="yes">Sign me up for the email updates
</br>
</br>
<input type="submit" value="Submit Review">

</fieldset>


</form>





</body>
</html>
